[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-poc"
version = "0.1.0"
description = "Email automation PoC: fine-tuned BERT vs. Gemini LLM comparison"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
run-classifier-poc = "email_poc.classifier.cli:main"
run-extraction-poc = "email_poc.extraction.cli:main"
download-bert-model = "email_poc.classifier.model_downloader:main"
